services:
  web:
    build: .
    container_name: loja-web
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: loja-db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: loja
      MYSQL_USER: loja_user
      MYSQL_PASSWORD: loja123
    volumes:
      - dados_mysql:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: loja-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  dados_mysql:
